name: Publish Obsidian plugin

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v2.10.1)'
        required: true
        default: 'v2.10.1'

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const tag = process.env.INPUT_TAG || (process.env.REF_TYPE === 'tag' ? process.env.REF_NAME : `v${require('./manifest.json').version}`);
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected vMAJOR.MINOR.PATCH');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Validate BRAT metadata and package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const manifest = require('./manifest.json'), pkg = require('./package.json'), versions = require('./versions.json');
          if (`v${manifest.version}` !== process.env.TAG || pkg.version !== manifest.version) throw new Error('Version mismatch');
          if (versions[manifest.version] !== manifest.minAppVersion) throw new Error('Missing minimum Obsidian version');
          for (const field of ['id', 'name', 'version', 'minAppVersion', 'description', 'author']) if (!manifest[field]) throw new Error(`Missing manifest field: ${field}`);
          for (const file of ['main.js', 'manifest.json', 'styles.css', `release-notes-${process.env.TAG}.md`]) if (!fs.statSync(file).size) throw new Error(`Empty release file: ${file}`);
          JS
          mkdir -p output/ledger-statistics
          cp main.js manifest.json styles.css output/ledger-statistics/
          cd output
          zip -r "ledger-statistics-${TAG}.zip" ledger-statistics
      - name: Upload BRAT files and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > /tmp/plugin-release.json; then
            node -e 'if (!require("/tmp/plugin-release.json").isDraft) throw new Error("Release is already published; refusing to replace its files")'
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "release-notes-${TAG}.md"
          fi
          gh release upload "$TAG" main.js manifest.json styles.css "output/ledger-statistics-${TAG}.zip" --clobber
          gh release edit "$TAG" --draft=false --latest
